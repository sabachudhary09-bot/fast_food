    <i class="fab fa-whatsapp"></i>

<!-- ✅ SIMPLE JS FOR QUANTITY -->
<script>
document.addEventListener("click", function(e){
  if(e.target.classList.contains("plus")){
    let input = e.target.parentElement.querySelector(".qty");
    input.value = parseInt(input.value) + 1;
  }

  if(e.target.classList.contains("minus")){
    let input = e.target.parentElement.querySelector(".qty");
    if(input.value > 1){
      input.value = parseInt(input.value) - 1;
    }
  }
});
</script>

<script>
function shareWhatsApp() {
  let message = "Hi! I want to confirm my order from your restaurant 🛒";
  let url = "https://wa.me/92XXXXXXXXXX?text=" + encodeURIComponent(message);
  window.open(url, "_blank");
}
</script>
<script>
document.querySelectorAll('.menu-card').forEach(card => {

  let plus = card.querySelector('.plus');
  let minus = card.querySelector('.minus');
  let qtyBox = card.querySelector('.qty');
  let qtyInput = card.querySelector('.qty-input');

  let size = card.querySelector('select');
  let order = card.querySelector('.order-type');
  let flavour = card.querySelector('.custom-select');

  let sizeInput = card.querySelector('.size-input');
  let orderInput = card.querySelector('.order-input');
  let flavourInput = card.querySelector('.flavour-input');

  // quantity buttons
  plus.addEventListener('click', () => {
    qtyBox.value = parseInt(qtyBox.value) + 1;
    qtyInput.value = qtyBox.value;
  });

  minus.addEventListener('click', () => {
    if (qtyBox.value > 1) {
      qtyBox.value = parseInt(qtyBox.value) - 1;
      qtyInput.value = qtyBox.value;
    }
  });

  // update hidden fields before submit
  card.querySelector('form').addEventListener('submit', () => {
    qtyInput.value = qtyBox.value;
    sizeInput.value = size.value;
    orderInput.value = order.value;
    flavourInput.value = flavour.value;
  });

});
</script>
